name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 必需门禁：两个平台 × 两个 Node 版本。
  # 判据是 tests>0 且 fail=0 且 skipped=0（由 tooling/test-gate.mjs 强制），
  # 不是「node --test 退出码为 0」。
  required:
    name: required (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: 环境信息
        shell: bash
        run: |
          node --version
          npm --version
          git --version
          uname -a || true

      - name: 自检（doctor）
        shell: bash
        run: node bin/rds.mjs doctor

      - name: 配置校验（JSON 严格 / YAML lint）
        shell: bash
        run: npm run config

      - name: Required 测试门禁
        shell: bash
        run: npm test

      - name: 门禁反向验证（注入 fail / skip 必须变红）
        shell: bash
        run: npm run test:gate-selfcheck

      - name: 发行包端到端（打包→检查→安装→doctor→写入→审批→检索→编译）
        shell: bash
        run: bash tooling/ci-smoke.sh

  # 母体系结构自检：PowerShell 实现，只在 Windows 跑。
  # 项目名检查已拆分——活跃资产必须为 0，历史记录（mars/docs 等）只告警。
  structure-selfcheck:
    name: structure self-check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: tests/self/run.ps1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/self/run.ps1

  # G1（WF5 Git 审查）目前**不在版本库里**（属开工前未提交的工作）。
  # 因此这里显式检测：文件存在才执行，不存在则打印 SKIP 并给出 warning 注解。
  # 一旦 G1 整体入库，本 job 自动转为真实执行，无需改 workflow。
  g1-powershell:
    name: g1 (windows-latest / powershell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: G1 六个夹具
        shell: powershell
        run: |
          if (-not (Test-Path 'tests/git-review/run.ps1')) {
            Write-Output "::warning title=G1 SKIPPED::tests/git-review/run.ps1 未纳入版本库（G1 工作流仍在工作区未提交），本次未执行夹具"
            Write-Output "SKIP: tests/git-review/run.ps1 不存在"
            exit 0
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/git-review/run.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
