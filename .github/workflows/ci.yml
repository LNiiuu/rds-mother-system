name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 必需门禁：两个平台 × 两个 Node 版本。
  # 判据是 tests>0 且 fail=0 且 skipped=0（由 tooling/test-gate.mjs 强制），
  # 不是「node --test 退出码为 0」。
  required:
    name: required (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: 环境信息
        shell: bash
        run: |
          node --version
          npm --version
          git --version
          uname -a || true

      - name: 自检（doctor）
        shell: bash
        run: node bin/rds.mjs doctor

      - name: 配置校验（JSON 严格 / YAML lint）
        shell: bash
        run: npm run config

      - name: 分层检查（端口零依赖 / 域无宿主耦合 / 无循环依赖）
        shell: bash
        run: npm run layers

      - name: 文档一致性（相对链接可达）
        shell: bash
        run: npm run docs:check

      - name: Required 测试门禁
        shell: bash
        run: npm test

      - name: 门禁反向验证（注入 fail / skip 必须变红）
        shell: bash
        run: npm run test:gate-selfcheck

      - name: 发行包端到端（打包→检查→安装→doctor→写入→审批→检索→编译）
        shell: bash
        run: bash tooling/ci-smoke.sh

  # macOS FTS5 前置探针（macOS 兼容性验证的第一步）。
  #
  # 为什么先做这一步：darwin 构建的 node:sqlite 是否启用 FTS5，静态阅读无法确定，
  # 而整个引擎的检索压在这一条上。先用一条最短路径验掉：
  #   - 记录 runner 实际架构、process.arch、Node 精确版本、内置 SQLite 版本
  #   - 走项目真实路径（mars/src/db.js 的 openDb → initSchema → CREATE VIRTUAL TABLE ... fts5）
  #   - 测创建、写入、MATCH 查询、memories+fts 联表检索
  # 失败即红。不提供跳过或降级出口——FTS5 不可用时「兼容」这个结论不成立。
  macos-probe:
    name: fts5 probe (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: 环境与 FTS5 前置探针
        shell: bash
        run: |
          set +e
          node tooling/fts5-probe.mjs > probe.txt 2>&1
          code=$?
          cat probe.txt
          {
            echo '## FTS5 probe'
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  # 母体系结构自检：PowerShell 实现，只在 Windows 跑。
  # 项目名检查已拆分——活跃资产必须为 0，历史记录（mars/docs 等）只告警。
  structure-selfcheck:
    name: structure self-check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: tests/self/run.ps1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/self/run.ps1

  # G1（WF5 Git 审查）已整体入库（提交 a41c650），这里真实执行六个夹具。
  # 任何夹具失败 -> 脚本非零退出 -> 本 job 失败；不使用 continue-on-error。
  #
  # 注意：本步骤的脚本正文必须是纯 ASCII。
  # GitHub 把 run 块写成 UTF-8 无 BOM 的 .ps1，而 Windows PowerShell 5.1 按 ANSI 解析，
  # 中文会把引号吃掉并导致语法错误（M2.1 首轮 CI 就栽在这里）。
  g1-powershell:
    name: g1 (windows-latest / powershell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: G1 六个夹具
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/git-review/run.ps1
          $code = $LASTEXITCODE
          Write-Output "g1 fixtures exit code: $code"
          exit $code
