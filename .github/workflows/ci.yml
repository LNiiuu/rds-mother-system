name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 必需门禁：两个平台 × 两个 Node 版本。
  # 判据是 tests>0 且 fail=0 且 skipped=0（由 tooling/test-gate.mjs 强制），
  # 不是「node --test 退出码为 0」。
  required:
    name: required (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: 环境信息
        shell: bash
        run: |
          node --version
          npm --version
          git --version
          uname -a || true

      - name: 自检（doctor）
        shell: bash
        run: node bin/rds.mjs doctor

      - name: 配置校验（JSON 严格 / YAML lint）
        shell: bash
        run: npm run config

      - name: 分层检查（端口零依赖 / 域无宿主耦合 / 无循环依赖）
        shell: bash
        run: npm run layers

      - name: 文档一致性（相对链接可达）
        shell: bash
        run: npm run docs:check

      - name: Required 测试门禁
        shell: bash
        run: npm test

      - name: 门禁反向验证（注入 fail / skip 必须变红）
        shell: bash
        run: npm run test:gate-selfcheck

      - name: 发行包端到端（打包→检查→安装→doctor→写入→审批→检索→编译）
        shell: bash
        run: bash tooling/ci-smoke.sh

  # macOS 实机验证（macOS 兼容性验证的第二步）。
  #
  # 范围刻意收窄：只跑 Node 22.x 一个版本。目的不是覆盖版本矩阵（Linux/Windows
  # 已有 22/24 两档），而是证明「darwin 上的 node:sqlite+FTS5、zlib zstd、
  # 符号链接、BSD 工具链、打包安装链路」可用。
  #
  # 第一步是 FTS5 探针：它失败就停，后面的步骤不再掩盖问题。
  # 探针输出同时写入 $GITHUB_STEP_SUMMARY，并在 Annotations 里留一条 notice，
  # 这样「哪个 arch / 哪个 Node 版本 / 哪个 SQLite 版本」在页面上直接可读，
  # 不必下载需要认证的 job 日志。
  #
  # 不跑 structure-selfcheck 与 g1：它们依赖 PowerShell。
  macos:
    name: macos (macos-latest / node 22.x)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: 环境信息
        shell: bash
        run: |
          node --version
          npm --version
          uname -a
          uname -m
          sw_vers

      - name: FTS5 前置探针
        shell: bash
        run: |
          set +e
          node tooling/fts5-probe.mjs > probe.txt 2>&1
          code=$?
          cat probe.txt
          {
            echo '## FTS5 probe'
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: 自检（doctor：node:sqlite+FTS5 / zlib zstd / 路径卫生）
        shell: bash
        run: |
          set +e
          node bin/rds.mjs doctor > doctor.txt 2>&1
          code=$?
          cat doctor.txt
          exit $code

      - name: Required 测试门禁
        shell: bash
        run: |
          set +e
          npm test > test-out.txt 2>&1
          code=$?
          cat test-out.txt
          {
            echo '## test gate'
            echo ''
            echo "exit=$code"
            echo '```'
            grep -E '^(not ok|# (tests|pass|fail|skipped))|^GATE ' test-out.txt | head -80
            echo '```'
            if [ "$code" -ne 0 ]; then
              echo ''
              echo '### failure detail'
              echo '```'
              grep -n -A 25 '^not ok' test-out.txt | head -120
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: 发行包端到端（打包→检查→安装→全链路）
        shell: bash
        run: |
          set +e
          bash tooling/ci-smoke.sh > smoke.txt 2>&1
          code=$?
          cat smoke.txt
          exit $code

      # 把三项结论固化成一条 annotation。
      # 原因：job 日志需要认证才能下载，而验收报告要引用「doctor 什么状态、
      # 测试多少项通过、smoke 是否通过」。annotation 是公开可读的。
      - name: 证据汇总（annotation）
        if: always()
        shell: bash
        run: |
          set +e
          doc=$(grep -Eo 'status: [a-z]+' doctor.txt 2>/dev/null | head -1)
          tst=$(grep -Eo 'GATE (PASS|FAIL) +tests=[0-9]+ pass=[0-9]+ fail=[0-9]+ skipped=[0-9]+' test-out.txt 2>/dev/null | head -1)
          smk=$(grep -Eo 'SMOKE (PASS|FAIL)' smoke.txt 2>/dev/null | head -1)
          [ -n "$doc" ] || doc='doctor=missing'
          [ -n "$tst" ] || tst='test=missing'
          [ -n "$smk" ] || smk='smoke=missing'
          msg="${doc} | ${tst} | ${smk}"
          echo "$msg"
          echo "::notice title=macos evidence::${msg}"
          {
            echo '## evidence'
            echo '```'
            echo "$msg"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 母体系结构自检：PowerShell 实现，只在 Windows 跑。
  # 项目名检查已拆分——活跃资产必须为 0，历史记录（mars/docs 等）只告警。
  structure-selfcheck:
    name: structure self-check (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'

      - name: tests/self/run.ps1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/self/run.ps1

  # G1（WF5 Git 审查）已整体入库（提交 a41c650），这里真实执行六个夹具。
  # 任何夹具失败 -> 脚本非零退出 -> 本 job 失败；不使用 continue-on-error。
  #
  # 注意：本步骤的脚本正文必须是纯 ASCII。
  # GitHub 把 run 块写成 UTF-8 无 BOM 的 .ps1，而 Windows PowerShell 5.1 按 ANSI 解析，
  # 中文会把引号吃掉并导致语法错误（M2.1 首轮 CI 就栽在这里）。
  g1-powershell:
    name: g1 (windows-latest / powershell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: G1 六个夹具
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/git-review/run.ps1
          $code = $LASTEXITCODE
          Write-Output "g1 fixtures exit code: $code"
          exit $code
